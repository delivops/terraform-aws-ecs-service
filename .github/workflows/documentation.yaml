name: Generate terraform docs
on:
  pull_request:
  # Only on main: a push to a PR branch is already covered by the
  # pull_request trigger, and running both made every such push render twice.
  push:
    branches:
      - main

permissions:
  contents: write
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Render terraform docs and push changes back to PR
        # Pinned to a commit SHA, not a branch or tag: this action runs with
        # contents: write and git-push enabled, so a moving ref would let
        # upstream push arbitrary commits to this repository. Renovate bumps
        # the pin via the version comment.
        uses: terraform-docs/gh-actions@6de6da0cefcc6b4b7a5cbea4d79d97060733093c # v1.4.1
        with:
          working-dir: .
          output-file: README.md
          output-method: inject
          git-push: "true"
